version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: resumematch_postgres
    restart: always
    environment:
      POSTGRES_DB: resumematch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
