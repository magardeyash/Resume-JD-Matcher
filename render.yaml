services:
  - type: web
    name: resumematch-app
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumematch-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIMENSIONS
        value: "768"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: MAX_RESUME_TEXT_LENGTH
        value: "15000"
      - key: MAX_JD_LENGTH
        value: "10000"

databases:
  - name: resumematch-db
    plan: free
    databaseName: resumematch
    user: postgres
